# Scope and policy for the executable documentation tests. See docs-tests/README.md.

[corpus]
include = ["**/*.md"]
exclude = [
  # Vendored Spec Kit command templates: upstream content, not ours to keep true.
  ".cursor/**",
  ".specify/templates/**",
  # Agent context: .claude/CLAUDE.md is generated by Repowise, and the command
  # files are vendored, so neither is written by hand here.
  ".claude/**",
  # Design handoff material, kept as a reference snapshot of the wireframes.
  "wireframes/**",
  # Fixtures for the harness's own tests, which are meant to fail.
  "docs-tests/tests/fixtures/**",
]
# Documents that record a moment in time. Their examples are still checked; their
# path claims are not, because they describe what was true when they were written
# (constitution section 11 puts the freshness obligation on spec.md, not on these).
point_in_time = [
  "specs/**/tasks.md",
  "specs/**/plan.md",
  "specs/**/research.md",
  "specs/**/splits/**",
  "specs/**/HANDOFF*.md",
  "specs/**/*-RUNBOOK.md",
  "docs/handoffs/**",
  "docs/patch-notes.md",
]

[references]
check_anchors = true
# Paths that are deliberately hypothetical: walkthroughs of what a finding or a
# future environment would look like.
ignore_paths = [
  # The Angular build cache: named by the Repowise exclude list, never committed.
  "neko-hoa/.angular",
  "neko-hoa/.angular/**",
  "infra/insecure.tf",
  "infra/environments/prod",
  "infra/environments/prod/**",
]

[shell]
# How long a docs-test=run block may take before it is a failure.
default_timeout = 60
# Extra command patterns a runnable block may never contain. The baseline list
# lives in docs_test/config.py (DEFAULT_DENYLIST) so that editing this file
# cannot make the gate destructive.
extra_denylist = []
