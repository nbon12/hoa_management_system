[pytest]
# Sybil's docs say to disable pytest's own doctest plugin so the two don't collide.
addopts = -p no:doctest -p docs_test.plugin --strict-markers -q
pythonpath = docs-tests
testpaths = .
norecursedirs =
    .git
    .github
    .idea
    .cursor
    .repowise
    .venv-repowise
    .venv-docs-tests
    node_modules
    bin
    obj
    coverage
    dist
    test-results
    playwright-report
    storybook-static
