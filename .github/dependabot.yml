version: 2
updates:
  # Keep SHA-pinned GitHub Actions current (FR-008). Bumps arrive as PRs that themselves
  # pass the Trivy security scan before merge.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions

  # The documentation test harness (Sybil, pytest, PyYAML) is version-pinned.
  - package-ecosystem: pip
    directory: /docs-tests
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
