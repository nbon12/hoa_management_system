# Ephemeral per-PR environment — teardown on close/merge (013 contracts/workflows.md, FR-006, SC-004).
# `closed` fires for both merge and plain close. Each step is best-effort/idempotent so one failure
# doesn't strand the rest; the daily sweep (pr-env-sweep.yml) backstops anything missed. The state is
# deleted only after a successful destroy, so the sweep can still find and retry a failed one (#236).
name: pr-env-teardown
# Ends in "(pr-<n>)": pr-env-clear-stale-lock.sh matches a live run to its PR by it (sweep, #236).
run-name: 'pr-env-teardown (pr-${{ github.event.number }})'

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write # WIF OIDC

concurrency:
  group: pr-env-${{ github.event.number }} # serialize against any in-flight provision
  cancel-in-progress: false

jobs:
  teardown:
    name: Teardown (state/pr/${{ github.event.number }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # No GitHub Environment gate (solo use — no per-run approval). Repo-level secrets; fork-safe via guard.
    env:
      TF_VAR_pr_number: ${{ github.event.number }}
      TF_VAR_head_sha: ${{ github.event.pull_request.head.sha }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_gcp_region: ${{ vars.GCP_REGION }}
      TF_VAR_neon_project_id: ${{ vars.NEON_PROJECT_ID }}
      TF_VAR_neon_base_branch_id: ${{ secrets.NEON_PR_BASE_BRANCH_ID }}
      TF_VAR_neon_role_password: ${{ secrets.NEON_PR_ROLE_PASSWORD }}
      TF_VAR_runtime_service_account: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      TF_VAR_stripe_publishable_key: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
      TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/pr-env-tofu-init
        with:
          pr_number: ${{ github.event.number }}
          wif_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # 1. Deregister the per-PR Stripe test webhook (D9).
      - name: Deregister Stripe webhook
        if: always()
        env:
          STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          PR_NUMBER: ${{ github.event.number }}
        run: scripts/stripe-webhook-deregister.sh || true

      # 2. Empty the R2 bucket — Cloudflare rejects deleting a non-empty bucket, so purge objects first
      #    (test documents the app uploaded). aws cli is preinstalled on ubuntu runners.
      - name: Purge R2 bucket objects
        if: always()
        working-directory: infra/environments/pr
        env:
          PRN: ${{ github.event.number }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          PREFIX: ${{ vars.SHARED_SECRET_PREFIX || 'dev' }}
        run: |
          set -uo pipefail
          BUCKET="nekohoa-pr-${PRN}-documents"
          ENDPOINT="$(gcloud secrets versions access latest --secret="${PREFIX}-storage-service-url" --project="$PROJECT" 2>/dev/null)" || exit 0
          AWS_ACCESS_KEY_ID="$(gcloud secrets versions access latest --secret="${PREFIX}-storage-access-key" --project="$PROJECT")"
          AWS_SECRET_ACCESS_KEY="$(gcloud secrets versions access latest --secret="${PREFIX}-storage-secret-key" --project="$PROJECT")"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION=auto
          aws s3 rm "s3://${BUCKET}" --recursive --endpoint-url "$ENDPOINT" || true

      # 3. Authoritative teardown: destroy every per-PR resource from this PR's state (FR-006). A lock
      #    left by a killed pr-env run was removed in pr-env-tofu-init (before init) once 45 min old; a
      #    younger one is waited for and, if it never clears, the destroy fails and keeps the state for
      #    the sweep (#236).
      - name: tofu destroy
        id: destroy
        if: always()
        working-directory: infra/environments/pr
        run: tofu destroy -input=false -auto-approve -lock-timeout=5m

      # 4. Remove the per-PR state objects so the prefix list (used by the sweep) reflects reality. Only
      #    after a successful destroy: deleting state after a failed one turns tracked resources into
      #    orphans nothing reclaims (PR 217, 2026-10-26). A kept state is retried by the daily sweep.
      - name: Delete per-PR state objects
        if: always() && steps.destroy.outcome == 'success'
        run: gcloud storage rm --recursive "gs://nekohoa-dev-tfstate/state/pr/${{ github.event.number }}"

      # 5. Best-effort: delete the PR's Pages branch deployments (free if left; pruned for tidiness, so
      #    failures are non-fatal). Every page is read before anything is deleted, and each id is logged.
      #    Per-PR Docker Hub image tags are not pruned.
      - name: Best-effort prune Pages deployments
        if: always()
        continue-on-error: true
        env:
          PRN: ${{ github.event.number }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/nekohoa-dev/deployments"
          ids="" page=1
          while [ "$page" -le 100 ]; do
            body="$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" "${api}?env=preview&page=${page}")" || break
            ids+="$(jq -r --arg b "pr-${PRN}" '.result[]? | select(.deployment_trigger.metadata.branch == $b) | .id' <<<"$body")"$'\n'
            [ "$page" -lt "$(jq -r '.result_info.total_pages // 1' <<<"$body")" ] || break
            page=$(( page + 1 ))
          done
          [ -n "${ids//$'\n'/}" ] || { echo "No Pages deployments on branch pr-${PRN}."; exit 0; }
          while read -r dep; do
            [ -n "$dep" ] || continue
            if curl -sSf -o /dev/null -X DELETE -H "Authorization: Bearer ${CF_TOKEN}" "${api}/${dep}?force=true"; then
              echo "Deleted Pages deployment ${dep}"
            else
              echo "::warning::Could not delete Pages deployment ${dep}"
            fi
          done <<<"$ids"

      # Teardown failure leaves billable resources behind until the next sweep: say so where someone reads.
      - name: Alert on teardown failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK_URL }}
          TEXT: "pr-env teardown FAILED for PR #${{ github.event.number }}. A failed destroy keeps the per-PR state; the daily pr-env-sweep retries it. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          [ -n "$WEBHOOK" ] || { echo "::warning::DEPLOY_ALERT_WEBHOOK_URL is unset; no alert sent."; exit 0; }
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK" || true
