# Apply on merge to main for infra/ changes (FR-026). Dev (and later Staging) auto-apply. Prod is not
# applied from here: it is promoted automatically by a scheduled workflow behind automated gates, with no
# required reviewer (FR-026 as amended 2026-11-02, decision D2; see the sketch at the bottom of this
# file). Authenticates via WIF (FR-027).
name: infra-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-apply.yml"

permissions:
  contents: read
  id-token: write # required for WIF OIDC

concurrency:
  group: infra-apply-dev
  cancel-in-progress: false # never cancel an in-flight apply

jobs:
  apply-dev:
    name: Apply (dev)
    runs-on: ubuntu-latest
    # Dev/Staging auto-apply with no manual gate (FR-026). No `environment:` protection here.
    defaults:
      run:
        working-directory: infra/environments/dev
    env:
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_stripe_publishable_key: ${{ vars.STRIPE_PUBLISHABLE_KEY }} # non-secret (browser-safe)
      TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_deploy_alert_webhook_url: ${{ secrets.DEPLOY_ALERT_WEBHOOK_URL }}
      TF_VAR_operator_secrets: ${{ secrets.TF_VAR_OPERATOR_SECRETS }}
      # 013: account-level billing budget for PR ephemeral envs (no default in dev/budget.tf).
      TF_VAR_billing_account_id: ${{ secrets.TF_VAR_BILLING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.8.0"

      - name: tofu init
        run: tofu init -input=false

      # Wait for a lock held by a live run (e.g. an operator's local plan) instead of failing at once (#236).
      - name: tofu apply
        run: tofu apply -input=false -auto-approve -lock-timeout=10m

  # --- Prod promotion (BUILD WHEN infra/environments/prod EXISTS) -----------------------------------
  # Not a job here. A push-triggered job can't meet FR-026's 24 h Staging soak, so Prod gets its own
  # workflow, `prod-promote.yml`. Its shape (FR-026 amended 2026-11-02, decision D2; constitution §14):
  #
  #   on: schedule (daily) + workflow_dispatch
  #   environment: prod   # keeps "Deployment branches: main only" and the Environment-scoped PROD_*
  #                       # secrets (never repo-wide); NO required reviewer
  #   steps, each failing closed with a red run:
  #     1. scripts/prod-promotion-gate.sh switch      PROD_OPS_AUTOMATED exactly "on" (tested: case-
  #                                                   sensitive, unlike an Actions `==`). On refusal,
  #                                                   post the reason on the ops-log issue: never a
  #                                                   silent job-level skip.
  #     2. pick the newest main commit that reached Staging ≥ 24 h ago, count the Staging apply, smoke
  #        and E2E runs that failed since then, and check both with scripts/prod-promotion-gate.sh soak
  #        (SHA, STAGING_APPLIED_AT, STAGING_FAILURES_SINCE: must be 0)
  #     3. the Staging smoke and E2E gates are green for that commit
  #     4. tofu plan -out, then `tofu show -json` to a file and scripts/prod-promotion-gate.sh plan
  #        (PLAN_JSON): no delete or replace of a stateful resource; an empty or broken file refuses
  #     5. tofu apply the saved plan
  #     6. after the apply: watch health and error rate for 15 min; on failure, move Cloud Run traffic
  #        back to the previous revision
  #     7. always: report the promotion (or why it didn't happen) on the ops-log issue and in the summary
  #
  # Secrets it will need, in the `prod` Environment: PROD_GCP_PROJECT_ID, PROD_NEON_API_KEY,
  # PROD_CLOUDFLARE_API_TOKEN, PROD_CLOUDFLARE_ACCOUNT_ID, PROD_CLOUDFLARE_ZONE_ID,
  # PROD_DEPLOY_ALERT_WEBHOOK_URL, PROD_TF_VAR_OPERATOR_SECRETS, PROD_GCP_WIF_PROVIDER,
  # PROD_GCP_DEPLOY_SERVICE_ACCOUNT.
