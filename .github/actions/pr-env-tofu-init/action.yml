# Reusable setup for every per-PR OpenTofu operation (013 T011): WIF auth (no static keys, FR-016) +
# OpenTofu + `tofu init` with the PER-PR state prefix (research D2). Shared by pr-env.yml (provision),
# pr-env-teardown.yml (destroy), and pr-env-sweep.yml (reclaim) so the init contract lives in one place.
name: "PR env tofu init"
description: "Authenticate via WIF and init infra/environments/pr against state/pr/<pr_number>."

inputs:
  pr_number:
    description: "PR number — selects the state prefix state/pr/<pr_number>."
    required: true
  wif_provider:
    description: "GCP Workload Identity provider (secret GCP_WIF_PROVIDER)."
    required: true
  service_account:
    description: "Deployer SA email (secret GCP_DEPLOY_SERVICE_ACCOUNT)."
    required: true
  tofu_version:
    description: "OpenTofu version."
    required: false
    default: "1.8.0"

runs:
  using: composite
  steps:
    # Current majors (auth@v2 and setup-opentofu@v1 target the deprecated Node 20), pinned by SHA (#236).
    - id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.wif_provider }}
        service_account: ${{ inputs.service_account }}

    # Before init, not after: when state/pr/<n>/ holds a lock but no default.tfstate (a run killed inside
    # its first `tofu init`), init itself takes the lock to write the empty state, and fails with a 412 on
    # a stale one. The clear needs only the token above (the runner's preinstalled gcloud), not tofu.
    # A failed lookup is not fatal: init and apply/destroy wait for any lock (-lock-timeout).
    - name: Clear a stale state lock left by a killed run
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
      run: scripts/pr-env-clear-stale-lock.sh || echo "::warning::Could not check the state lock; tofu waits for it (-lock-timeout)."

    # No wrapper: tofu receives the runner's cancel signal directly, so it can release its state lock.
    # Defence in depth only; pr-env.yml no longer cancels in-flight runs (#234).
    - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version: ${{ inputs.tofu_version }}
        tofu_wrapper: false

    # Per-PR remote state: same bucket as Dev, isolated by prefix state/pr/<n> (research D2).
    - name: tofu init (state/pr/${{ inputs.pr_number }})
      shell: bash
      working-directory: infra/environments/pr
      run: tofu init -input=false -lock-timeout=5m -backend-config="prefix=state/pr/${{ inputs.pr_number }}"
